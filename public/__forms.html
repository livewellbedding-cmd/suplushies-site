<!DOCTYPE html>
<html lang="en">
<!--
  Netlify Forms registry. Netlify reads this file at deploy time to learn
  which forms and fields exist. The real forms live in the React pages and
  submit here with fetch(). If you add a field to a form, add it here too.
-->
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<form name="wholesale-quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="business-name"><input name="carries-toys"><input name="city"><input name="country"><input name="selling-regions"><input name="collections"><input name="contact-preference"><input name="contact-time"><input name="current-suppliers"><input name="display-space"><input name="ein"><input name="email"><input name="exclusive-interest"><input name="help-wanted"><input name="list-on-store-finder"><input name="locations"><input name="machine-count"><input name="machine-size"><input name="monthly-volume"><input name="name"><input name="opening-budget"><input name="opening-stage"><input name="order-size"><input name="path-choice"><input name="phone"><input name="price-point"><input name="prize-cost"><input name="prize-sizes"><input name="product-types"><input name="resale-permit"><input name="restock-frequency"><input name="role"><input name="sales-channel"><input name="sample-interest"><input name="setting"><input name="shopper-age"><input name="source"><input name="state"><input name="store-type"><input name="timeline"><input name="toy-section-program"><input name="toy-space"><input name="website"><input name="years-open"><input name="resale-to"><input name="online-platforms"><input name="path"><input name="subject"><textarea name="wishlist"></textarea><textarea name="store-addresses"></textarea><textarea name="best-sellers"></textarea><textarea name="message"></textarea>
</form>
<form name="inquiry-list" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="store"><input name="email"><input name="phone"><input name="country"><input name="selling-regions">
  <input name="account-status"><textarea name="notes"></textarea><textarea name="items"></textarea><input name="units">
</form>
<form name="store-suggestion" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="store-name"><input name="store-type"><input name="store-website"><input name="store-city"><input name="store-region"><input name="store-country"><input name="store-location"><input name="wants"><input name="collections"><input name="product-types"><input name="relationship"><input name="name"><input name="email"><input name="notify">
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="phone"><input name="company"><input name="country"><input name="selling-regions"><input name="topic"><textarea name="message"></textarea>
</form>
<form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="email"><input name="source">
</form>
<form name="wholesale-order" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field"><input name="account"><input name="business"><input name="contact"><input name="email"><input name="phone"><textarea name="ship_to"></textarea><textarea name="notes"></textarea><input name="tier"><input name="item_count"><input name="units"><input name="list_total"><input name="subtotal"><input name="order_discount"><input name="total"><textarea name="lines"></textarea><textarea name="order_code"></textarea></form></body>
</html>
