<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Official photo coming soon">
<style>
.f{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif}
.sh{animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(600px)}}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.8s}.d3{animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.sh,.tw,.fl{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ee"/><stop offset="1" stop-color="#f6eee2"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="ph"><rect x="180" y="64" width="440" height="440" rx="24"/></clipPath>
<clipPath id="pill"><rect x="130" y="556" width="540" height="74" rx="37"/></clipPath>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<g class="fl">
<rect x="166" y="50" width="468" height="468" rx="32" fill="#fff" stroke="#e8dccb" stroke-width="2"/>
<image clip-path="url(#ph)" x="180" y="64" width="440" height="440" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64,"/>
</g>
<g fill="#f46a5e">
<path class="tw" d="M110 150l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
<path class="tw d2" d="M690 110l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#4f7a5a"/>
<path class="tw d3" d="M680 440l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
</g>
<g clip-path="url(#pill)">
<rect x="130" y="556" width="540" height="74" rx="37" fill="#0f2845"/>
<rect class="sh" x="130" y="556" width="160" height="74" fill="url(#gl)"/>
</g>
<g transform="translate(170 573)" fill="none" stroke="#fff3d6" stroke-width="3.5" stroke-linejoin="round">
<rect x="0" y="6" width="38" height="28" rx="6"/><circle cx="19" cy="20" r="8"/><path d="M12 6l4-6h6l4 6"/>
</g>
<text class="f" x="226" y="604" text-anchor="start" font-size="29" font-weight="700" fill="#fff" textLength="400" lengthAdjust="spacingAndGlyphs">Official photo coming soon</text>
<text class="f" x="400" y="680" text-anchor="middle" font-size="25" fill="#5b6575">Preview shown above. Ask us for details with your quote.</text>
<text class="f" x="400" y="746" text-anchor="middle" font-size="34" font-weight="800"><tspan fill="#f46a5e">Su</tspan><tspan fill="#0f2845">Plushies</tspan></text>
</svg>
